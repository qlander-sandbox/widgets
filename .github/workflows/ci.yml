name: CI
on:
  pull_request:
  push:
    branches: [main, "queue/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: test -f README.md
      - name: Fail on queue branches when a marker asks for it
        env:
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$REF" in refs/heads/queue/*) ;; *) exit 0 ;; esac
          if [ -f FAIL_ON_QUEUE ]; then echo "FAIL_ON_QUEUE is present on $REF"; exit 1; fi
          if [ -f FLAKY_ON_QUEUE ] && [ "$ATTEMPT" = 1 ]; then echo "FLAKY_ON_QUEUE first attempt on $REF"; exit 1; fi
